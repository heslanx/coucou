# Koncluí's own checks, on the organization's Linux server (self-hosted runner `vps-ci-contabo-notch`, label
# `konclui-notch`). A self-hosted runner spends no Actions minutes, so these run while GitHub's hosted runners are out of
# budget. What needs macOS (the build, the Swift tests) stays in build.yml. docs/konclui/WORKFLOW.md, "CI".
name: Koncluí checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: konclui-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: [self-hosted, linux, konclui-notch]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No secret in the new commits (gitleaks)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="${RANGE#*..}~1..${RANGE#*..}";; esac
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --log-opts="$RANGE"

      - name: Rebrand rules leave nothing to rename
        run: python3 scripts/konclui/rebrand.py --check

      - name: Koncluí copy rules
        run: python3 scripts/konclui/test-copy.py

      - name: Localization (every key in every language)
        run: python3 scripts/test-localization.py

      - name: What's new entries
        run: python3 scripts/test-whats-new.py

      - name: Updater rules match Coucou's updater files
        run: |
          git remote add upstream https://github.com/Louis-CFM/coucou.git 2>/dev/null || true
          git fetch -q --no-tags upstream main
          bash scripts/konclui/test-updater-rules.sh

      - name: Orca relay hook
        run: python3 scripts/konclui/test-orca-relay.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update service
        run: cd updates && npm test
